[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpad"
version = "0.1.0"
description = "Host bridge for the agentpad ESP32 macropad (agent status in RGB + keyboard actions)"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "pynput>=1.7",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12.0",
    "psutil>=5.9",
    "pywin32>=306; sys_platform == 'win32'",   # foreground window, sessions, key guard rail
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",   # radial menu, screen, mouse (macOS)
]

[project.optional-dependencies]
# joystick radial menu (transparent window always on top, drawn with PIL): optional
widget = ["Pillow>=10", "numpy>=1.24"]
test = ["pytest>=8"]

[project.scripts]
agentpad = "agentpad.cli:main"
agentpad-gui = "agentpad.webui.server:run"
agentpad-widget = "agentpad.webui.widget:run"
agentpad-hooks = "agentpad.hooks.install:main"
agentpad-autostart = "agentpad.autostart:main"

[tool.setuptools.packages.find]
include = ["agentpad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
